name: CI - Validación y Pruebas de API MLOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Verificar sintaxis de scripts Python
        run: python3 -m py_compile main.py frontend.py entrenar_modelo.py

      - name: Construir imagen Docker
        run: docker build -t api-intrusiones-test .

      - name: Probar contenedor y endpoint raíz
        run: |
          docker run -d -p 8000:8000 --name test-api api-intrusiones-test
          sleep 15
          curl -f http://localhost:8000/ || (docker logs test-api && exit 1)
          docker stop test-api